name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚需求与使用场景，便于评估。
  - type: textarea
    id: problem
    attributes:
      label: 需求描述
      description: 你想解决什么问题 / 想实现什么功能
      placeholder: 例如：希望支持实例的定时任务配置
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情况下会用到这个功能
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望的交互方式或实现思路（可选）
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 目前的临时解决办法（可选）
